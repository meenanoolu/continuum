# Render Blueprint - https://render.com
# Deploy: Dashboard → New → Blueprint → connect this repo
services:
  - type: web
    name: continuum
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: META_API_KEY
        sync: false
      - key: BASETEN_API_KEY
        sync: false
      - key: META_BASE_URL
        value: https://api.meta.ai/v1
      - key: META_MODEL
        value: muse-spark-1.3
      - key: META_REASONING_EFFORT
        value: low
      - key: BASETEN_BASE_URL
        value: https://inference.baseten.co/v1
      - key: BASETEN_MODEL
        value: meta-models/muse-spark-open-1026
      - key: BASETEN_REASONING_EFFORT
        value: low
      - key: REASONING_HEADROOM
        value: "2500"
      - key: USE_MUSE_CODE
        value: "0"
      - key: MEMORY_PATH
        value: /tmp/personal_memory.json
      - key: SESSION_PATH
        value: /tmp/session.json
      - key: WORKSPACE_DIR
        value: /tmp/workspace